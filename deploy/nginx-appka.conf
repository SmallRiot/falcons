# /etc/nginx/sites-available/appka.gihl.ge — Falcons за Cloudflare.
# Мини-приложение и API: / → 127.0.0.1:8787, веб-консоль: /console/ → 127.0.0.1:8788.
# 80 не редиректит на https: Cloudflare сам ходит на сервер и по http (Flexible), и по https (Full).

map $http_upgrade $falcons_conn { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name appka.gihl.ge;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    include /etc/nginx/snippets/falcons-app.conf;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name appka.gihl.ge;

    ssl_certificate     /etc/letsencrypt/live/appka.gihl.ge/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/appka.gihl.ge/privkey.pem;

    include /etc/nginx/snippets/falcons-app.conf;
}
