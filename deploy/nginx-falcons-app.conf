# /etc/nginx/snippets/falcons-app.conf — общие правила для 80 и 443
client_max_body_size 12m;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $falcons_conn;

location = /console { return 301 /console/; }
location /console/ { proxy_pass http://127.0.0.1:8788/; }
location / { proxy_pass http://127.0.0.1:8787; }
