<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <!-- Пример обложки профиля: мультяшное вбрасывание на льду (свой рисунок Falcons) -->
  <defs>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe9f5"/>
      <stop offset="1" stop-color="#9fcbe0"/>
    </linearGradient>
    <linearGradient id="blueJ" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3fa3ec"/><stop offset="1" stop-color="#1c6fb4"/></linearGradient>
    <linearGradient id="redJ" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6a3d"/><stop offset="1" stop-color="#d6331a"/></linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#ice)"/>
  <!-- царапины на льду -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".7" fill="none">
    <path d="M40 90 L260 70"/><path d="M90 140 L330 128"/><path d="M820 60 L1080 80"/><path d="M900 120 L1160 112"/>
    <path d="M60 330 L300 350"/><path d="M880 330 L1150 350"/><path d="M200 230 L360 226"/><path d="M860 230 L1010 238"/>
  </g>
  <!-- круг вбрасывания -->
  <ellipse cx="600" cy="300" rx="250" ry="70" fill="none" stroke="#e05555" stroke-width="6" opacity=".55"/>
  <circle cx="600" cy="300" r="10" fill="#e05555" opacity=".7"/>
  <!-- судья в полоску, поднял руку -->
  <g transform="translate(600 120)">
    <path d="M-36 40 L36 40 L44 150 L-44 150 Z" fill="#111"/>
    <g fill="#ffd23f"><rect x="-38" y="58" width="76" height="14"/><rect x="-40" y="88" width="80" height="14"/><rect x="-42" y="118" width="84" height="14"/></g>
    <path d="M36 50 C70 20 90 -20 100 -60" stroke="#111" stroke-width="18" stroke-linecap="round" fill="none"/>
    <path d="M36 50 C70 20 90 -20 100 -60" stroke="#ffd23f" stroke-width="18" stroke-linecap="round" stroke-dasharray="14 14" fill="none"/>
    <circle cx="104" cy="-72" r="16" fill="#f0bd95"/>
    <path d="M-36 52 C-60 80 -60 110 -40 140" stroke="#111" stroke-width="18" stroke-linecap="round" fill="none"/>
    <circle cx="0" cy="10" r="34" fill="#f0bd95"/>
    <path d="M-34 0 C-30 -40 30 -40 34 0 C20 -16 -20 -16 -34 0 Z" fill="#2a2a2a"/>
    <circle cx="-11" cy="8" r="4" fill="#222"/><circle cx="11" cy="8" r="4" fill="#222"/>
    <ellipse cx="0" cy="24" rx="8" ry="6" fill="#e05555"/>
    <circle cx="-22" cy="22" r="6" fill="#ff9a9a" opacity=".6"/><circle cx="22" cy="22" r="6" fill="#ff9a9a" opacity=".6"/>
  </g>
  <!-- синий игрок (Falcons), наклонился на вбрасывание -->
  <g transform="translate(360 250)">
    <path d="M-80 -40 C-60 -90 20 -90 50 -50 L60 40 L-90 40 Z" fill="url(#blueJ)"/>
    <path d="M-70 -20 L40 -20" stroke="#fff" stroke-width="10"/>
    <path d="M40 -40 C80 -40 110 -10 120 20" stroke="url(#blueJ)" stroke-width="26" stroke-linecap="round" fill="none"/>
    <circle cx="126" cy="26" r="15" fill="#123"/>
    <path d="M126 30 L240 72" stroke="#c98a3a" stroke-width="10" stroke-linecap="round"/>
    <path d="M232 66 L262 82 L250 92 L224 78 Z" fill="#2a2a2a"/>
    <circle cx="70" cy="-70" r="36" fill="#f0bd95"/>
    <path d="M34 -72 C34 -118 106 -118 106 -72 L100 -66 C96 -96 44 -96 40 -66 Z" fill="#1c6fb4"/>
    <circle cx="82" cy="-66" r="5" fill="#222"/>
    <path d="M72 -48 Q88 -40 100 -50" stroke="#7a4a33" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="96" cy="-56" r="6" fill="#ff9a9a" opacity=".6"/>
    <path d="M-60 40 L-70 110 M10 40 L20 110" stroke="#0d1f2d" stroke-width="22" stroke-linecap="round"/>
    <path d="M-92 116 L-46 116 M-2 116 L44 116" stroke="#c8d8e0" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- красный соперник, тоже на вбрасывании -->
  <g transform="translate(840 250) scale(-1 1)">
    <path d="M-80 -40 C-60 -90 20 -90 50 -50 L60 40 L-90 40 Z" fill="url(#redJ)"/>
    <path d="M-70 -20 L40 -20" stroke="#111" stroke-width="10" stroke-dasharray="16 10"/>
    <path d="M40 -40 C80 -40 110 -10 120 20" stroke="url(#redJ)" stroke-width="26" stroke-linecap="round" fill="none"/>
    <circle cx="126" cy="26" r="15" fill="#111"/>
    <path d="M126 30 L240 72" stroke="#c98a3a" stroke-width="10" stroke-linecap="round"/>
    <path d="M232 66 L262 82 L250 92 L224 78 Z" fill="#2a2a2a"/>
    <circle cx="70" cy="-70" r="36" fill="#f0bd95"/>
    <path d="M38 -84 C50 -110 96 -110 104 -84 Z" fill="#fff"/>
    <path d="M40 -86 L104 -86" stroke="#d6331a" stroke-width="5"/>
    <circle cx="82" cy="-66" r="5" fill="#222"/>
    <path d="M70 -50 Q88 -36 102 -52" stroke="#7a4a33" stroke-width="4" fill="#fff" stroke-linecap="round"/>
    <circle cx="98" cy="-58" r="6" fill="#ff9a9a" opacity=".6"/>
    <path d="M-60 40 L-70 110 M10 40 L20 110" stroke="#111" stroke-width="22" stroke-linecap="round"/>
    <path d="M-92 116 L-46 116 M-2 116 L44 116" stroke="#c8d8e0" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- шайба между клюшками -->
  <ellipse cx="600" cy="338" rx="16" ry="7" fill="#111"/>
</svg>
