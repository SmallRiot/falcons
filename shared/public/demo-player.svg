<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- пример фото в рамке: крутой хоккеист в шлеме с визором, №88 Falcons -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4f7a"/>
      <stop offset="1" stop-color="#0b1f30"/>
    </linearGradient>
    <linearGradient id="helmet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a9be0"/>
      <stop offset="1" stop-color="#1b5d96"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9df3ca" stop-opacity=".75"/>
      <stop offset=".5" stop-color="#2ec4ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7b61ff" stop-opacity=".7"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- лёд и огни арены -->
  <circle cx="30" cy="30" r="3" fill="#fff" opacity=".5"/>
  <circle cx="170" cy="24" r="2.5" fill="#fff" opacity=".45"/>
  <circle cx="150" cy="44" r="1.8" fill="#fff" opacity=".35"/>
  <!-- плечи и джерси -->
  <path d="M28 200 C30 160 62 142 100 142 C138 142 170 160 172 200 Z" fill="#2b88cf"/>
  <path d="M28 200 C30 176 44 162 60 156 L66 200 Z M172 200 C170 176 156 162 140 156 L134 200 Z" fill="#f2f8fa"/>
  <path d="M84 146 L100 164 L116 146" fill="none" stroke="#f2f8fa" stroke-width="6" stroke-linejoin="round"/>
  <text x="100" y="194" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="26" fill="#f2f8fa" text-anchor="middle">88</text>
  <!-- шея -->
  <rect x="86" y="128" width="28" height="20" rx="8" fill="#e2a982"/>
  <!-- лицо -->
  <ellipse cx="100" cy="104" rx="34" ry="38" fill="#f0bd95"/>
  <path d="M80 118 Q100 132 120 118" fill="none" stroke="#7a4a33" stroke-width="3" stroke-linecap="round"/>
  <path d="M86 120 L92 121" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <!-- шлем -->
  <path d="M60 104 C58 66 78 46 100 46 C122 46 142 66 140 104 L134 106 C134 86 120 72 100 72 C80 72 66 86 66 106 Z" fill="url(#helmet)"/>
  <path d="M70 58 C84 48 116 48 130 58" fill="none" stroke="#9fd2f5" stroke-width="3" stroke-linecap="round" opacity=".8"/>
  <rect x="58" y="96" width="12" height="22" rx="5" fill="#1b5d96"/>
  <rect x="130" y="96" width="12" height="22" rx="5" fill="#1b5d96"/>
  <!-- визор -->
  <path d="M64 88 C76 82 124 82 136 88 L134 104 C120 100 80 100 66 104 Z" fill="url(#visor)" stroke="#e9f6fb" stroke-width="2"/>
  <path d="M72 90 L92 88" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".85"/>
  <!-- логотип на шлеме -->
  <path d="M95 60 L100 52 L105 60 L100 64 Z" fill="#e9c57e"/>
</svg>
